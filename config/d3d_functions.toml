# [native renderer, M0] Ninja Gaiden II's Xbox 360 Direct3D functions (XDK 2.0.6683).
#
# The game has no symbols: every name here is identified from behaviour - the
# GPU packets a function builds, the kernel exports it calls, the offsets it
# reads through its arguments (the public XDK structures: D3DTexture's fetch
# constant at 0x1C, a vertex buffer's fetch words at 0x18/0x1C, D3DVIEWPORT9's
# 24 bytes), and how many places in the game call it. tools/native/d3d_map.py
# produces the evidence (docs/native/d3d_map.txt).
#
# confidence: "anchor" = calls a unique kernel export; "strong" = behaviour
# and argument layout both match; "guess" = plausible, unconfirmed. Promote to
# "confirmed" only after a console run (call counts / arguments logged).
#
# All take the device in r3; the args below are r4, r5, ...

[functions]
