# Device fields outside the register mirror (NG2 offsets; SVR 2011's are
# 0xB8 higher for the shaders: its +0x3244/+0x3248).
[device_fields]
12684 = "current pixel shader object (SetPixelShader)"
12688 = "current vertex shader object (SetVertexShader)"
16544 = "Swap count (D3DDevice_Swap increments it)"
13508 = "command buffer write pointer (13512: its end; 0x8373F180 makes room)"
