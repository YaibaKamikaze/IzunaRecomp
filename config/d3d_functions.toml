0x8373A918 = { name = "D3DDevice_InitializeGpu", confidence = "anchor", note = "VdInitializeRingBuffer, VdEnableRingBufferRPtrWriteBack, VdSetSystemCommandBufferGpuIdentifierAddress (part of CreateDevice)" }
