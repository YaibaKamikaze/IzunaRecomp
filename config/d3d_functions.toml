# The D3DDevice keeps a copy of the GPU's registers and flushes the dirty ones
# at each draw (D3DDevice_DrawIndexedVertices 0x8373BD50). Dirty masks: 64-bit
# words at device+0, +8, +16, +24, +32. Flush helpers: 0x83743548 (one bit per
# 16 registers), 0x837431A8 (one bit per register), 0x837433E8 / 0x83743268
# (other layouts - fetch constants, to map). Register R lives at
# device + copy + (R - base) * 4. Render states the game sets inline (most
# SetRenderState_* / SetSamplerState_* are header inlines: no call) are read
# from here at draw time.
0x8373B1F8 = { name = "D3DDevice_SetVertexShaderConstantF", confidence = "strong", note = "traced (start 0x10, float data, count 25); ~668 per frame" }
0x8373B3C8 = { name = "D3D_CreateShaderFromContainer", confidence = "strong", note = "traced: r6 = a shader container (102A1101): links runtime shader objects to containers" }
0x837370F0 = { name = "d3d_per_draw_837370F0", confidence = "guess", note = "~581 per frame = one per indexed draw (SetIndices? r4 0, r5 0xC/4)" }
0x837369A8 = { name = "d3d_per_texture_837369A8", confidence = "guess", note = "~1259 per frame, with SetTexture (sampler state?)" }
0x83736EC8 = { name = "d3d_rt_setup_83736EC8", confidence = "guess", note = "~53 per frame; r4 = rect {0,0,0xFFFF,0xFFFF} + 1.0f, r5 = surface" }

